worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log query strings: future URLs may contain sensitive user input.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        # Browser transports may carry a bearer token in the query. Access logs use $uri;
        # Nginx error logs cannot redact request lines, so suppress them on this exact path.
        location = /api/v1/realtime/notifications {
            error_log /dev/null;
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # API errors must remain API responses, never SPA fallback HTML.
        location ~ ^/(api(?:/|$)|health/(?:live|ready)$) {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # Demo proxy is not a trusted source of client identity. Backend forwarding is off.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
        }
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
